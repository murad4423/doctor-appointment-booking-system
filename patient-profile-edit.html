<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - Doctor Appointment System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .profile-container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .profile-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .profile-header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .profile-header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .profile-form {
            padding: 40px;
        }

        .form-section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 20px;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.3s;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group input:disabled {
            background: #f5f5f5;
            cursor: not-allowed;
        }

        .required {
            color: #e74c3c;
        }

        .form-actions {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-save {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-cancel {
            background: #f0f0f0;
            color: #666;
        }

        .btn-cancel:hover {
            background: #e0e0e0;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .message.error {
            background: #fee;
            color: #c33;
            border: 1px solid #fcc;
            display: block;
        }

        .message.success {
            background: #efe;
            color: #3c3;
            border: 1px solid #cfc;
            display: block;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        @media (max-width: 768px) {
            .profile-form {
                padding: 30px 20px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .form-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="profile-container">
        <div class="profile-header">
            <h1>✏️ Edit Profile</h1>
            <p>Update your personal information</p>
        </div>

        <div class="profile-form">
            <div id="loadingState" class="loading">Loading profile...</div>
            
            <div id="formContainer" style="display: none;">
                <div id="message" class="message"></div>

                <form id="profileForm" onsubmit="handleSubmit(event)">
                    <!-- Personal Information -->
                    <div class="form-section">
                        <h2 class="section-title">Personal Information</h2>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="fullName">Full Name <span class="required">*</span></label>
                                <input type="text" id="fullName" required placeholder="Enter your full name">
                            </div>
                            
                            <div class="form-group">
                                <label for="patientId">Patient ID</label>
                                <input type="text" id="patientId" readonly>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="age">Age <span class="required">*</span></label>
                                <input type="number" id="age" required min="1" max="150" placeholder="Enter your age">
                            </div>
                            
                            <div class="form-group">
                                <label for="gender">Gender <span class="required">*</span></label>
                                <select id="gender" required>
                                    <option value="">Select gender</option>
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="bloodGroup">Blood Group <span class="required">*</span></label>
                                <select id="bloodGroup" required>
                                    <option value="">Select blood group</option>
                                    <option value="A+">A+</option>
                                    <option value="A-">A-</option>
                                    <option value="B+">B+</option>
                                    <option value="B-">B-</option>
                                    <option value="AB+">AB+</option>
                                    <option value="AB-">AB-</option>
                                    <option value="O+">O+</option>
                                    <option value="O-">O-</option>
                                </select>
                            </div>
                            
                            <div class="form-group">
                                <label for="dateOfBirth">Date of Birth</label>
                                <input type="date" id="dateOfBirth">
                            </div>
                        </div>
                    </div>

                    <!-- Contact Information -->
                    <div class="form-section">
                        <h2 class="section-title">Contact Information</h2>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="phone">Phone Number <span class="required">*</span></label>
                                <input type="tel" id="phone" required placeholder="Enter your phone number">
                            </div>
                            
                            <div class="form-group">
                                <label for="emergencyContact">Emergency Contact</label>
                                <input type="tel" id="emergencyContact" placeholder="Emergency contact number">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="address">Address <span class="required">*</span></label>
                            <textarea id="address" required placeholder="Enter your full address"></textarea>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="city">City</label>
                                <input type="text" id="city" placeholder="City">
                            </div>
                            
                            <div class="form-group">
                                <label for="country">Country</label>
                                <input type="text" id="country" placeholder="Country">
                            </div>
                        </div>
                    </div>

                    <!-- Medical Information -->
                    <div class="form-section">
                        <h2 class="section-title">Medical Information</h2>
                        
                        <div class="form-group">
                            <label for="allergies">Allergies</label>
                            <textarea id="allergies" placeholder="List any allergies (e.g., penicillin, peanuts)"></textarea>
                        </div>

                        <div class="form-group">
                            <label for="medicalHistory">Medical History</label>
                            <textarea id="medicalHistory" placeholder="Brief medical history (e.g., diabetes, hypertension)"></textarea>
                        </div>

                        <div class="form-group">
                            <label for="currentMedications">Current Medications</label>
                            <textarea id="currentMedications" placeholder="List any medications you're currently taking"></textarea>
                        </div>
                    </div>

                    <!-- Additional Information -->
                    <div class="form-section">
                        <h2 class="section-title">Additional Information</h2>
                        
                        <div class="form-group">
                            <label for="additionalNotes">Additional Notes</label>
                            <textarea id="additionalNotes" placeholder="Any additional information you'd like to add"></textarea>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn btn-cancel" onclick="cancelEdit()">Cancel</button>
                        <button type="submit" class="btn btn-save" id="saveBtn">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore, doc, getDoc, updateDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyBgL3nTaBFS1789IwrsFb1SN4T7GIas3Jk",
            authDomain: "doctor-booking-b556e.firebaseapp.com",
            projectId: "doctor-booking-b556e",
            storageBucket: "doctor-booking-b556e.firebasestorage.app",
            messagingSenderId: "573037462071",
            appId: "1:573037462071:web:a21ae3786e8b8a3758b5b2",
            measurementId: "G-NQ9BK8LFJM"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;

        // Check authentication
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                await loadProfile(user.uid);
            } else {
                window.location.href = 'patient-auth.html';
            }
        });

        async function loadProfile(uid) {
            try {
                const docRef = doc(db, 'patients', uid);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    populateForm(data);
                    
                    document.getElementById('loadingState').style.display = 'none';
                    document.getElementById('formContainer').style.display = 'block';
                } else {
                    window.location.href = 'patient-profile-setup.html';
                }
            } catch (error) {
                console.error('Error loading profile:', error);
                showMessage('Failed to load profile. Please try again.', 'error');
            }
        }

        function populateForm(data) {
            document.getElementById('fullName').value = data.fullName || '';
            document.getElementById('patientId').value = data.patientId || '';
            document.getElementById('age').value = data.age || '';
            document.getElementById('gender').value = data.gender || '';
            document.getElementById('bloodGroup').value = data.bloodGroup || '';
            document.getElementById('dateOfBirth').value = data.dateOfBirth || '';
            document.getElementById('phone').value = data.phone || '';
            document.getElementById('emergencyContact').value = data.emergencyContact || '';
            document.getElementById('address').value = data.address || '';
            document.getElementById('city').value = data.city || '';
            document.getElementById('country').value = data.country || '';
            document.getElementById('allergies').value = data.allergies || '';
            document.getElementById('medicalHistory').value = data.medicalHistory || '';
            document.getElementById('currentMedications').value = data.currentMedications || '';
            document.getElementById('additionalNotes').value = data.additionalNotes || '';
        }

        window.handleSubmit = async function(e) {
            e.preventDefault();
            
            if (!currentUser) {
                showMessage('Please log in first.', 'error');
                return;
            }

            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.textContent = 'Saving...';

            const updatedData = {
                fullName: document.getElementById('fullName').value,
                age: parseInt(document.getElementById('age').value),
                gender: document.getElementById('gender').value,
                bloodGroup: document.getElementById('bloodGroup').value,
                dateOfBirth: document.getElementById('dateOfBirth').value || null,
                phone: document.getElementById('phone').value,
                emergencyContact: document.getElementById('emergencyContact').value || null,
                address: document.getElementById('address').value,
                city: document.getElementById('city').value || null,
                country: document.getElementById('country').value || null,
                allergies: document.getElementById('allergies').value || null,
                medicalHistory: document.getElementById('medicalHistory').value || null,
                currentMedications: document.getElementById('currentMedications').value || null,
                additionalNotes: document.getElementById('additionalNotes').value || null,
                updatedAt: new Date().toISOString()
            };

            try {
                const docRef = doc(db, 'patients', currentUser.uid);
                await updateDoc(docRef, updatedData);
                
                showMessage('Profile updated successfully! Redirecting...', 'success');
                
                setTimeout(() => {
                    window.location.href = 'patient-profile.html';
                }, 1500);
            } catch (error) {
                console.error('Error updating profile:', error);
                showMessage('Failed to update profile. Please try again.', 'error');
                btn.disabled = false;
                btn.textContent = 'Save Changes';
            }
        };

        window.cancelEdit = function() {
            if (confirm('Are you sure you want to discard changes?')) {
                window.location.href = 'patient-profile.html';
            }
        };

        function showMessage(text, type) {
            const message = document.getElementById('message');
            message.className = `message ${type}`;
            message.textContent = text;
            message.style.display = 'block';
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            if (type === 'success') {
                setTimeout(() => {
                    message.style.display = 'none';
                }, 3000);
            }
        }
    </script>
</body>
</html>
