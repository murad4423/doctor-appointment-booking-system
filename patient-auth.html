<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Login - Doctor Appointment System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 450px;
            width: 100%;
            overflow: hidden;
        }

        .auth-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .auth-header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .auth-header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .auth-tabs {
            display: flex;
            border-bottom: 2px solid #f0f0f0;
        }

        .tab {
            flex: 1;
            padding: 20px;
            text-align: center;
            background: white;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            color: #666;
            transition: all 0.3s;
        }

        .tab.active {
            color: #667eea;
            border-bottom: 3px solid #667eea;
        }

        .tab:hover {
            background: #f8f9fa;
        }

        .auth-form {
            padding: 30px;
        }

        .form-content {
            display: none;
        }

        .form-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .message.error {
            background: #fee;
            color: #c33;
            border: 1px solid #fcc;
            display: block;
        }

        .message.success {
            background: #efe;
            color: #3c3;
            border: 1px solid #cfc;
            display: block;
        }

        .back-home {
            text-align: center;
            margin-top: 20px;
        }

        .back-home a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .back-home a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .auth-header h1 {
                font-size: 24px;
            }
            
            .auth-form {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1>🏥 Patient Portal</h1>
            <p>Access your health information</p>
        </div>

        <div class="auth-tabs">
            <button class="tab active" onclick="switchTab('login')">Login</button>
            <button class="tab" onclick="switchTab('register')">Register</button>
        </div>

        <div class="auth-form">
            <!-- Login Form -->
            <div id="loginForm" class="form-content active">
                <div id="loginMessage" class="message"></div>
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="loginEmail">Email Address</label>
                        <input type="email" id="loginEmail" required placeholder="Enter your email">
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <input type="password" id="loginPassword" required placeholder="Enter your password">
                    </div>
                    <button type="submit" class="btn-submit" id="loginBtn">Login</button>
                </form>
            </div>

            <!-- Register Form -->
            <div id="registerForm" class="form-content">
                <div id="registerMessage" class="message"></div>
                <form onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label for="registerEmail">Email Address</label>
                        <input type="email" id="registerEmail" required placeholder="Enter your email">
                    </div>
                    <div class="form-group">
                        <label for="registerPassword">Password</label>
                        <input type="password" id="registerPassword" required minlength="6" placeholder="Minimum 6 characters">
                    </div>
                    <div class="form-group">
                        <label for="registerConfirmPassword">Confirm Password</label>
                        <input type="password" id="registerConfirmPassword" required placeholder="Re-enter your password">
                    </div>
                    <button type="submit" class="btn-submit" id="registerBtn">Create Account</button>
                </form>
            </div>

            <div class="back-home">
                <a href="index.html">← Back to Home</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, setPersistence, browserLocalPersistence } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore, doc, setDoc, getDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyBgL3nTaBFS1789IwrsFb1SN4T7GIas3Jk",
            authDomain: "doctor-booking-b556e.firebaseapp.com",
            projectId: "doctor-booking-b556e",
            storageBucket: "doctor-booking-b556e.firebasestorage.app",
            messagingSenderId: "573037462071",
            appId: "1:573037462071:web:a21ae3786e8b8a3758b5b2",
            measurementId: "G-NQ9BK8LFJM"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Set persistence to keep user logged in
        setPersistence(auth, browserLocalPersistence);

        // Check if user is already logged in
        auth.onAuthStateChanged((user) => {
            if (user) {
                checkProfileExists(user.uid);
            }
        });

        async function checkProfileExists(uid) {
    try {
        const docRef = doc(db, 'patients', uid);
        const docSnap = await getDoc(docRef);
        
        // Check for redirect parameters
        const urlParams = new URLSearchParams(window.location.search);
        const redirect = urlParams.get('redirect');
        const doctorId = urlParams.get('doctor');
        
        if (docSnap.exists()) {
            // Profile exists
            if (redirect === 'booking' && doctorId) {
                window.location.href = `booking.html?doctor=${doctorId}`;
            } else {
                window.location.href = 'patient-profile.html';
            }
        } else {
            // Need to create profile first
            sessionStorage.setItem('pendingRedirect', redirect || '');
            sessionStorage.setItem('pendingDoctor', doctorId || '');
            window.location.href = 'patient-profile-setup.html';
        }
    } catch (error) {
        console.error('Error checking profile:', error);
    }
}

        window.switchTab = function(tab) {
            const tabs = document.querySelectorAll('.tab');
            const forms = document.querySelectorAll('.form-content');
            
            tabs.forEach(t => t.classList.remove('active'));
            forms.forEach(f => f.classList.remove('active'));
            
            if (tab === 'login') {
                tabs[0].classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                tabs[1].classList.add('active');
                document.getElementById('registerForm').classList.add('active');
            }
            
            // Clear messages
            document.getElementById('loginMessage').style.display = 'none';
            document.getElementById('registerMessage').style.display = 'none';
        };

        window.handleLogin = async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');
            const message = document.getElementById('loginMessage');
            
            btn.disabled = true;
            btn.textContent = 'Logging in...';
            message.style.display = 'none';
            
            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                message.className = 'message success';
                message.textContent = 'Login successful! Redirecting...';
                message.style.display = 'block';
                
                // Check if profile exists
                checkProfileExists(userCredential.user.uid);
            } catch (error) {
                message.className = 'message error';
                if (error.code === 'auth/user-not-found') {
                    message.textContent = 'No account found with this email.';
                } else if (error.code === 'auth/wrong-password') {
                    message.textContent = 'Incorrect password.';
                } else if (error.code === 'auth/invalid-email') {
                    message.textContent = 'Invalid email address.';
                } else {
                    message.textContent = 'Login failed. Please try again.';
                }
                message.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Login';
            }
        };

        window.handleRegister = async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('registerConfirmPassword').value;
            const btn = document.getElementById('registerBtn');
            const message = document.getElementById('registerMessage');
            
            message.style.display = 'none';
            
            if (password !== confirmPassword) {
                message.className = 'message error';
                message.textContent = 'Passwords do not match.';
                message.style.display = 'block';
                return;
            }
            
            btn.disabled = true;
            btn.textContent = 'Creating account...';
            
            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                message.className = 'message success';
                message.textContent = 'Account created! Redirecting to profile setup...';
                message.style.display = 'block';
                
                // Redirect to profile setup
                setTimeout(() => {
                    window.location.href = 'patient-profile-setup.html';
                }, 1500);
            } catch (error) {
                message.className = 'message error';
                if (error.code === 'auth/email-already-in-use') {
                    message.textContent = 'This email is already registered.';
                } else if (error.code === 'auth/weak-password') {
                    message.textContent = 'Password is too weak. Use at least 6 characters.';
                } else if (error.code === 'auth/invalid-email') {
                    message.textContent = 'Invalid email address.';
                } else {
                    message.textContent = 'Registration failed. Please try again.';
                }
                message.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Create Account';
            }
        };
    </script>
</body>
</html>
